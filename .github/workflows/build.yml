name: Build

on:
  push:
    branches: [main, "foundation/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SpaceRP.sln

      - name: Build
        run: dotnet build SpaceRP.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SpaceRP.sln --configuration Release --no-build
